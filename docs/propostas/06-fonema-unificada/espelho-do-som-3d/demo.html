<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FONEMA · Espelho do Som — como a boca faz cada som</title>
<!-- Protótipo local, sem dependências externas. Nada é gravado nem enviado: a câmera (opcional) fica só nesta tela. -->
<link rel="stylesheet" href="espelho.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<header class="topo">
  <div class="titulo"><span class="logo" aria-hidden="true">🪞</span><div><b>Espelho do Som</b><small>como a boca faz cada som</small></div></div>
  <div class="ajustes">
    <button class="chip" id="bNomes" aria-pressed="true">🏷️ Nomes</button>
    <button class="chip" id="bLento" aria-pressed="false">🐢 Câmera lenta</button>
  </div>
</header>

<main class="tela">
  <section class="palco-area">
    <div id="vFrente" class="palco vista on" aria-label="Boca gigante de frente"></div>
    <div id="vLado" class="palco vista" aria-label="De lado, com a janelinha na bochecha"></div>
    <nav class="modos" aria-label="Como olhar a boca">
      <button data-modo="frente" class="on">😮 De frente</button>
      <button data-modo="lado">🔍 De lado</button>
    </nav>
    <div class="quem" id="quem" role="group" aria-label="Quem mostra"><button data-q="sofia" class="on">Sofia</button><button data-q="tales">Tales</button></div>
    <p class="aviso-fono" role="note">posições simplificadas — validar com fonoaudióloga</p>
  </section>

  <aside class="lado">
    <div class="som-atual">
      <div class="cartaz" aria-live="polite">
      <div class="letra" id="cLetra">A</div>
      <div><div class="ipa" id="cIpa">/a/</div><div class="ex" id="cEx">abelha</div></div>
      <div class="selos"><span class="selo-voz" id="cVoz">🐝 tem voz</span><span class="selo-ar" id="cAr">💨 ar pela boca</span></div>
    </div>
      <div class="espelho-sofia">
        <p id="sofiaLeg">A Sofia faz assim</p>
        <button class="ouvir" id="bOuvir" aria-label="Ouvir o som">🔊 Ouvir</button>
      </div>
    </div>
    <div class="abas" role="tablist">
      <button role="tab" data-aba="explorar" class="on">Explorar</button>
      <button role="tab" data-aba="lingua">Onde está a língua?</button>
      <button role="tab" data-aba="voz">Tem voz?</button>
      <button role="tab" data-aba="imite">Imite a Sofia</button>
      <button role="tab" data-aba="corpo">Meu corpo</button>
    </div>
    <div class="painel" id="painel" aria-live="polite"></div>
  </aside>
</main>

<footer class="teclado" id="teclado" aria-label="Escolha um som"></footer>

<p class="rodape-nota">“Ouvir” toca as vozes oficiais da Sofia e do Tales (só os sons que já têm gravação). Câmera opcional, só neste aparelho.</p>

<script src="fonemas.js"></script>
<script src="espelho-frente.js"></script>
<script src="espelho-lado.js"></script>
<script src="espelho-audio.js"></script>
<script src="demo.js"></script>
</body>
</html>
