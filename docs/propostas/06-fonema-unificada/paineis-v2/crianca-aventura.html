.ouvir.p{width:38px;height:38px}

.pontos i.f{background:#F4B400;box-shadow:inset 0 -2px 0 #D98E00}
.mis .ok{width:26px;height:26px;border-radius:50%;background:#2F9E5B;display:grid;place-items:center}

.album div.nao{background:#EEF3F7;border:2px dashed #C9D6E0}
.emb{display:flex;gap:8px;margin-top:10px;justify-content:space-between}
.emb div{width:52px;height:58px;display:grid;place-items:center}

.balao:after{content:"";position:absolute;left:-14px;bottom:26px;border:14px solid transparent;border-right-color:#fff;border-left:0}
.balao .row{display:flex;align-items:center;gap:10px;margin-top:8px}
/* linha de baixo */
.baixo{position:fixed;left:200px;right:20px;bottom:16px;display:grid;grid-template-columns:330px 230px 220px 1fr;gap:12px;align-items:end}
.baixo .card{position:static;height:164px}

.vids .vid{border-radius:14px}
.vids .vid .vt{font-size:15px;top:10%;left:9%}
.vids .vid img{height:150%;bottom:-58%;right:-16%}
.vids .vid .play{width:28px;height:28px;bottom:9%}
.vila,.prox{margin-top:6px;height:110px;border-radius:16px;overflow:hidden;position:relative}
.vamos{display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,#4CC062,#33A04A);color:#fff;font-family:Fredoka;font-weight:700;font-size:38px;border:0;border-radius:34px;height:110px;box-shadow:0 8px 0 #24793A,0 18px 30px rgba(43,35,64,.25)}
.vamos i{width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center}
.pino{position:fixed;transform:translate(-50%,-100%);pointer-events:none;display:grid;justify-items:center}
.pino .bolha{background:#fff;border-radius:18px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:8px;font-family:Fredoka;font-weight:700;font-size:17px;box-shadow:0 5px 0 #F4B400,0 12px 24px rgba(30,40,60,.25)}
.pino .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#FFC94A,#F28C28);overflow:hidden;position:relative}
.pino .av img{position:absolute;width:150%;left:-25%;top:-6%}
.pino .seta{width:0;height:0;border:10px solid transparent;border-top-color:#fff;margin-top:-1px}
