   <text x="1424" y="806" font-size="15.5" fill="#5B5A72">Filhote de tatu-bola (Tolypeutes</text><text x="1424" y="830" font-size="15.5" fill="#5B5A72">tricinctus), fauna da Caatinga e do</text><text x="1424" y="854" font-size="15.5" fill="#5B5A72">Cerrado, ameaçado de extinção.</text><text x="1424" y="878" font-size="15.5" fill="#5B5A72">Erra de propósito o que a criança</text><text x="1424" y="902" font-size="15.5" fill="#5B5A72">JÁ domina (p/b, f/v, b/d…); a</text><text x="1424" y="926" font-size="15.5" fill="#5B5A72">criança corrige e ele melhora de</text><text x="1424" y="950" font-size="15.5" fill="#5B5A72">verdade na sessão. Nunca é piada</text><text x="1424" y="974" font-size="15.5" fill="#5B5A72">humilhante. Rolar como bola é seu</text><text x="1424" y="998" font-size="15.5" fill="#5B5A72">jeito de "pensar" ou se acalmar.</text></svg></body></html>
