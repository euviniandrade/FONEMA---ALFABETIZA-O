<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css"><script src="engine.js"></script>
<style>
#im{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#shade{position:absolute;left:0;right:0;bottom:0;height:72%;background:linear-gradient(180deg,rgba(31,29,61,0) 0,rgba(31,29,61,.62) 45%,rgba(31,29,61,.93) 100%)}
#box{position:absolute;left:40px;max-width:calc(100% - 230px);bottom:38px;color:#fff;background:rgba(31,29,61,.9);border:4px solid #fff;border-radius:30px;padding:22px 30px 24px;box-shadow:0 10px 0 rgba(31,29,61,.25)}
body.v #box{max-width:calc(100% - 80px)}
.cat{display:inline-flex;align-items:center;gap:10px;font-family:Fredoka;font-weight:700;font-size:24px;padding:8px 18px;border-radius:99px;border:3px solid var(--tinta);color:var(--tinta)}
h1{font-family:Fredoka;font-weight:700;font-size:62px;line-height:1.02;margin:14px 0 14px}
.meta{display:flex;gap:12px;align-items:center}
.meta span{font-family:Fredoka;font-weight:700;font-size:22px;background:rgba(255,255,255,.95);color:var(--tinta);border-radius:10px;padding:4px 12px}
.meta .d{background:var(--sol)}
#play{position:absolute;right:52px;bottom:52px;width:120px;height:120px;border-radius:50%;background:var(--urucum);border:6px solid #fff;display:grid;place-items:center;box-shadow:0 8px 0 rgba(31,29,61,.35)}
body.v h1{font-size:56px}
body.v #shade{display:none}
body.v #play{bottom:auto;top:560px}
</style></head><body>
<div id="stage"><img id="im"><div id="shade"></div>
<div id="play"><svg viewBox="0 0 48 48" width="56"><path d="M15,9 L39,24 L15,39Z" fill="#fff"/></svg></div>
<div id="box"><div class="cat" id="cat"></div><h1 id="t"></h1><div class="meta" id="meta"></div></div></div>
<script>
const v = Q.get('v') === '1'; if (v) document.body.classList.add('v');
$('#im').src = Q.get('img'); $('#cat').textContent = Q.get('cat'); $('#cat').style.background = Q.get('col') || '#FFC83D';
$('#t').innerHTML = Q.get('title');
$('#meta').innerHTML = `<span class="d">${Q.get('dur')}</span><span>CC</span><span>Libras</span>` + (Q.get('extra') ? `<span>${Q.get('extra')}</span>` : '');
if (Q.get('noplay')) $('#play').style.display = 'none';
if (Q.get('bare')) { $('#cat').style.display = 'none'; $('#t').style.display = 'none'; $('#shade').style.display = 'none'; $('#box').style.padding = '12px 16px'; $('#box').style.borderRadius = '20px'; }
window.renderAt = () => {};
window.__ready = (async () => { await document.fonts.ready; await new Promise(r => $('#im').complete ? r() : $('#im').onload = r); })();
</script></body></html>
