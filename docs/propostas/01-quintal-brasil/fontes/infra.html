a a frio ≤ 3 s; crash-free ≥ 99,5%</text><text x="1218" y="893" font-family="Atkinson" font-size="12.3" fill="#6E5D52">métricas éticas: dose acima da faixa gera alerta, não meta</text><text x="1218" y="910" font-family="Atkinson" font-size="12.3" fill="#6E5D52">plano de incidente: ANPD e famílias em até 3 dias úteis*</text><text x="36" y="988" font-family="Atkinson" font-size="12.5" fill="#6E5D52" >* Prazos legais a confirmar com o jurídico (Resolução ANPD de incidentes). Supabase não exige servidor próprio: banco, auth, storage e funções ficam na região São Paulo; somente TTS (build) e o fallback opcional de fala usam a Azure (região Brazil South).</text></svg></body></html>
